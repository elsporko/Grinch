      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/users/:
    get:
      operationId: api_users_list
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GrinchUser'
          description: ''
  /api/users/{id}:
    get:
      operationId: api_users_list_2
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GrinchUser'
          description: ''
  /login/:
    post:
      operationId: login_create
      tags:
      - login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrinchLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GrinchLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GrinchLogin'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrinchLogin'
          description: ''
  /logout/:
    post:
      operationId: logout_create
      tags:
      - logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrinchUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GrinchUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GrinchUser'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrinchUser'
          description: ''
  /register/:
    post:
      operationId: register_create
      tags:
      - register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrinchUserRegister'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GrinchUserRegister'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GrinchUserRegister'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrinchUserRegister'
          description: ''
components:
  schemas:
    GrinchLogin:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - password
      - username
    GrinchUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        password:
          type: string
          maxLength: 128
        last_login:
          type: string
          format: date-time
          nullable: true
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
        route:
          type: string
          nullable: true
        groups:
          type: array
          items:
            type: integer
          description: The groups this user belongs to. A user will get all permissions
            granted to each of their groups.
        user_permissions:
          type: array
          items:
            type: integer
          description: Specific permissions for this user.
      required:
      - id
      - name
      - password
      - username
    GrinchUserRegister:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        password:
          type: string
          maxLength: 128
        last_login:
          type: string
          format: date-time
          nullable: true
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
        route:
          type: string
          nullable: true
        groups:
          type: array
          items:
            type: integer
          description: The groups this user belongs to. A user will get all permissions
            granted to each of their groups.
        user_permissions:
          type: array
          items:
            type: integer
          description: Specific permissions for this user.
      required:
      - id
      - password
      - username
    PatchedPicklist:
      type: object
      properties:
        order_id:
          type: integer
        pickup_date:
          type: string
          format: date
        route:
          type: string
          nullable: true
        name:
          type: string
          readOnly: true
        home_phone:
          type: string
          maxLength: 128
        email:
          type: string
          format: email
          maxLength: 128
        street_address:
          type: string
          maxLength: 140
        where_is_it:
          type: string
          nullable: true
          maxLength: 30
        client_comment:
          type: string
          nullable: true
          maxLength: 256
        admin_comment:
          type: string
          nullable: true
          maxLength: 500
        got_money:
          type: boolean
        got_tree:
          type: boolean
        first_name:
          type: string
          nullable: true
          maxLength: 64
        last_name:
          type: string
          nullable: true
          maxLength: 64
    PatchedRoute:
      type: object
      properties:
        order_id:
          type: integer
        abbrev:
          type: string
          maxLength: 5
        name:
          type: string
          maxLength: 30
        active:
          type: boolean
    Picklist:
      type: object
      properties:
        order_id:
          type: integer
        pickup_date:
          type: string
          format: date
        route:
          type: string
          nullable: true
        name:
          type: string
          readOnly: true
        home_phone:
          type: string
          maxLength: 128
        email:
          type: string
          format: email
          maxLength: 128
        street_address:
          type: string
          maxLength: 140
        where_is_it:
          type: string
          nullable: true
          maxLength: 30
        client_comment:
          type: string
          nullable: true
          maxLength: 256
        admin_comment:
          type: string
          nullable: true
          maxLength: 500
        got_money:
          type: boolean
        got_tree:
          type: boolean
        first_name:
          type: string
          nullable: true
          maxLength: 64
        last_name:
          type: string
          nullable: true
          maxLength: 64
      required:
      - email
      - name
      - order_id
      - pickup_date
      - street_address
    Route:
      type: object
      properties:
        order_id:
          type: integer
        abbrev:
          type: string
          maxLength: 5
        name:
          type: string
          maxLength: 30
        active:
          type: boolean
      required:
      - abbrev
      - name
      - order_id
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
