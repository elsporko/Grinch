openapi: 3.0.3
info:
  title: Grinch API
  version: 1.0.0
  description: API for Grinch Delivery Management System
paths:
  /api/picklists/:
    get:
      operationId: api_picklists_list
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Picklist'
          description: ''
    post:
      operationId: api_picklists_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Picklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Picklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Picklist'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Picklist'
          description: ''
  /api/picklists/{order_id}/:
    get:
      operationId: api_picklists_retrieve
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        description: A unique value identifying this pick list.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Picklist'
          description: ''
    put:
      operationId: api_picklists_update
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        description: A unique value identifying this pick list.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Picklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Picklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Picklist'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Picklist'
          description: ''
    patch:
      operationId: api_picklists_partial_update
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        description: A unique value identifying this pick list.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPicklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPicklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPicklist'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Picklist'
          description: ''
    delete:
      operationId: api_picklists_destroy
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        description: A unique value identifying this pick list.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/picklists/assign_groups/:
    put:
      operationId: api_picklists_assign_groups_update
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Picklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Picklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Picklist'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Picklist'
          description: ''
  /api/routes/:
    get:
      operationId: api_routes_list
      description: Display a single route
      tags:
